name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Core runtime deps + pytest, plus keras for the VGG16 embedding tests
        # (they only need keras.preprocess_input; the fake_vgg16 fixture stubs
        # the model, so no ImageNet weights are downloaded). Keras runs on the
        # torch backend (set in preprocessing/__init__.py), so no tensorflow.
        # The headless OpenCV build avoids needing system GUI libraries on the
        # runner. The CPU torch wheel (from the pytorch CPU index, not the CUDA
        # build pinned in requirements.txt) backs both keras and the CNN/ViT
        # model tests.
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas opencv-python-headless Pillow scikit-learn joblib pytest
          pip install keras
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: pytest
